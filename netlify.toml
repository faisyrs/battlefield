[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# OAuth 2.1 authorization server and MCP resource metadata
[[redirects]]
  from = "/.well-known/oauth-authorization-server"
  to = "https://mvkqwisscspojgsgddgj.supabase.co/functions/v1/battlefield-oauth/metadata"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-protected-resource/mcp"
  to = "https://mvkqwisscspojgsgddgj.supabase.co/functions/v1/battlefield-oauth/resource"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "https://mvkqwisscspojgsgddgj.supabase.co/functions/v1/battlefield-oauth/resource"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/:action"
  to = "https://mvkqwisscspojgsgddgj.supabase.co/functions/v1/battlefield-oauth/:action"
  status = 200
  force = true

[[redirects]]
  from = "/mcp"
  to = "https://mvkqwisscspojgsgddgj.supabase.co/functions/v1/battlefield-oauth/mcp"
  status = 200
  force = true
